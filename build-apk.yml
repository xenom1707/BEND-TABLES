name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/shivanov/bendcalculator app/src/main/assets app/src/main/res/values
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "BendCalculator"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.7.3" apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android { namespace="com.shivanov.bendcalculator"; compileSdk=35
            defaultConfig { applicationId="com.shivanov.bendcalculator"; minSdk=23; targetSdk=35; versionCode=2; versionName="2.0" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Bend Calculator" android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item></style></resources>
          EOF
          cat > app/src/main/java/com/shivanov/bendcalculator/MainActivity.java <<'EOF'
          package com.shivanov.bendcalculator;
          import android.app.*; import android.os.*; import android.content.*; import android.net.Uri; import android.print.PrintAttributes; import android.print.PrintManager; import android.webkit.*; import java.io.*; import java.nio.charset.StandardCharsets;
          public class MainActivity extends Activity {
            WebView webView; String pendingText=""; static final int SAVE_FILE=1001;
            @Override public void onCreate(Bundle b){ super.onCreate(b); webView=new WebView(this); setContentView(webView); WebSettings s=webView.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); webView.addJavascriptInterface(new Bridge(),"Android"); webView.loadUrl("file:///android_asset/index.html"); }
            class Bridge {
              @JavascriptInterface public void printPage(){ runOnUiThread(()->{ PrintManager pm=(PrintManager)getSystemService(PRINT_SERVICE); pm.print("Bend Database",webView.createPrintDocumentAdapter("Bend Database"),new PrintAttributes.Builder().build()); }); }
              @JavascriptInterface public void saveTextFile(String name,String mime,String text){ pendingText=text; runOnUiThread(()->{ Intent i=new Intent(Intent.ACTION_CREATE_DOCUMENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType(mime); i.putExtra(Intent.EXTRA_TITLE,name); startActivityForResult(i,SAVE_FILE); }); }
            }
            @Override protected void onActivityResult(int req,int res,Intent data){ super.onActivityResult(req,res,data); if(req==SAVE_FILE&&res==RESULT_OK&&data!=null){ Uri u=data.getData(); if(u!=null)try(OutputStream o=getContentResolver().openOutputStream(u)){ o.write(pendingText.getBytes(StandardCharsets.UTF_8)); }catch(Exception e){ e.printStackTrace(); } } }
          }
          EOF
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest" /tmp/android-tools
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/tools.zip
            unzip -q /tmp/tools.zip -d /tmp/android-tools
            cp -R /tmp/android-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BendCalculator-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
